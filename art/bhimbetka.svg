        <line x1="0" y1="20" x2="18" y2="65" stroke="#F4EFE6" stroke-width="4" />
        <!-- Drawn Bow and Arrow -->
        <path d="M15,-30 Q35,0 15,30" stroke="#F4EFE6" stroke-width="3" fill="none" />
        <line x1="25" y1="0" x2="-20" y2="0" stroke="#F4EFE6" stroke-width="2.5" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="roganFabric" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18233C" />
      <stop offset="70%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070C15" />
    </radialGradient>
  </defs>
  <!-- Deep Indigo/Black Fabric Ground -->
  <rect width="800" height="600" fill="url(#roganFabric)" />

  <!-- Intricate Fine Castor-Oil Thread Borders -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#F4B728" stroke-width="4" />
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="45" y="45" width="710" height="510" fill="none" stroke="#E25822" stroke-width="2.5" />

  <!-- Symmetrical Rogan "Tree of Life" -->
  <g transform="translate(400, 480)">
    <!-- Base Floral Urn / Mound -->
    <path d="M-60,0 C-40,-30 40,-30 60,0 Z" fill="#F4B728" stroke="#FFFFFF" stroke-width="2" />
    <!-- Central Symmetrical Stylized Trunk -->
    <line x1="0" y1="0" x2="0" y2="-320" stroke="#F4B728" stroke-width="7" stroke-linecap="round" />

    <!-- Symmetrical Curving Branches & Paisley Rosettes -->
    
      <!-- Left Branch -->
      <path d="M0,-70 C-35,-70 -70,-90 -70,-110" stroke="#E25822" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="-70" cy="-110" r="9" fill="#E25822" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-70" cy="-110" r="4" fill="#0E1626" />

      <!-- Right Mirror Branch -->
      <path d="M0,-70 C35,-70 70,-90 70,-110" stroke="#E25822" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="70" cy="-110" r="9" fill="#E25822" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="70" cy="-110" r="4" fill="#0E1626" />
    
      <!-- Left Branch -->
      <path d="M0,-130 C-55,-130 -110,-150 -110,-190" stroke="#F4B728" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="-110" cy="-190" r="9" fill="#F4B728" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-110" cy="-190" r="4" fill="#0E1626" />

      <!-- Right Mirror Branch -->
      <path d="M0,-130 C55,-130 110,-150 110,-190" stroke="#F4B728" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="110" cy="-190" r="9" fill="#F4B728" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="110" cy="-190" r="4" fill="#0E1626" />
    
      <!-- Left Branch -->
      <path d="M0,-190 C-70,-190 -140,-210 -140,-270" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="-140" cy="-270" r="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-140" cy="-270" r="4" fill="#0E1626" />

      <!-- Right Mirror Branch -->
      <path d="M0,-190 C70,-190 140,-210 140,-270" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="140" cy="-270" r="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="140" cy="-270" r="4" fill="#0E1626" />
    
      <!-- Left Branch -->
      <path d="M0,-250 C-55,-250 -110,-270 -110,-310" stroke="#E25822" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="-110" cy="-310" r="9" fill="#E25822" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-110" cy="-310" r="4" fill="#0E1626" />

      <!-- Right Mirror Branch -->
      <path d="M0,-250 C55,-250 110,-270 110,-310" stroke="#E25822" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="110" cy="-310" r="9" fill="#E25822" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="110" cy="-310" r="4" fill="#0E1626" />
    
      <!-- Left Branch -->
      <path d="M0,-300 C-35,-300 -70,-320 -70,-340" stroke="#F4B728" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="-70" cy="-340" r="9" fill="#F4B728" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-70" cy="-340" r="4" fill="#0E1626" />

      <!-- Right Mirror Branch -->
      <path d="M0,-300 C35,-300 70,-320 70,-340" stroke="#F4B728" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="70" cy="-340" r="9" fill="#F4B728" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="70" cy="-340" r="4" fill="#0E1626" />
    

    <!-- Apex Symmetrical Crown Flower -->
    <g transform="translate(0, -340)">
      <circle cx="0" cy="0" r="16" fill="#F4B728" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#E25822" />
      <path d="M0,-16 C-12,-32 12,-32 0,-16 Z" fill="#FFFFFF" stroke="#F4B728" stroke-width="1.5" />
    </g>
  </g>
</svg>